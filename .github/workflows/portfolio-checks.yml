name: Portfolio V5 checks
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "v5.css"
      - "v5.js"
      - "projects/**"
      - "tests/**"
      - ".github/workflows/portfolio-checks.yml"
  pull_request:
    branches: [main]
jobs:
  static-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test HTML, project claims, URLs and JavaScript
        run: node tests/check-site.mjs
